name = "derp"
main = "dist/index.mjs"
workers_dev = true
compatibility_date = "2025-11-17"
send_metrics = false

[placement]
mode = "smart"

[build]
command = "yarn build"

[site]
bucket = "./build"

[durable_objects]
bindings = [
  { name = "client_logs", class_name = "ClientLog" }
]

[[migrations]]
tag = "v1"
new_classes = ["ClientLog"]
