name = "derp"
main = "server/index.ts"
workers_dev = true
compatibility_date = "2023-07-01"
send_metrics = false
tsconfig = "tsconfig.json"

[vars]
# Salt for hashing client IPs (change in production using wrangler secret)
ID_SALT = "dev-salt-change-in-production"

[placement]
mode = "smart"

[build]
command = "yarn build"

[site]
bucket = "./build"

[durable_objects]
bindings = [
  { name = "client_logs_v2", class_name = "ClientLogV2" }
]

[[migrations]]
tag = "v1"
new_classes = ["ClientLog"]

[[migrations]]
tag = "v2"
deleted_classes = ["ClientLog"]
new_classes = ["ClientLogV2"]
